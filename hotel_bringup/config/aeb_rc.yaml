rc_aeb:
  ros__parameters:
    use_sim_time: false
    # Commissioning interlock: confirm measured bounds/geometry before enabling.
    calibration_confirmed: false
    ttc_threshold: 0.45
    release_ttc_threshold: 0.65
    release_hold_time: 0.3
    release_scan_count: 3
    scan_timeout: 0.3
    command_timeout: 0.3
    future_stamp_tolerance: 0.1
    output_rate: 25.0
    throttle_limit: 0.4
    steering_limit: 0.5
    # Provisional envelopes, NOT measured velocities or normalized throttle gains.
    footprint_radius_m: 0.45
    forward_speed_bound_mps: 2.0
    reverse_speed_bound_mps: 1.0
    coast_timeout: 1.0
    front_fov_deg: 180.0
    rear_fov_deg: 180.0
    lidar_yaw_deg: 0.0
    scan_frame: laser_frame
    output_frame: base_link
    min_valid_readings: 5
    min_valid_fraction: 0.3
    max_invalid_gap_deg: 10.0
    min_closing_speed_mps: 0.01
    brake_steering_mode: hold
    fail_safe_steering: 0.0
