joy_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.05
    autorepeat_rate: 20.0
    sticky_buttons: false
teleop_node:
  ros__parameters:
    axis_linear:
      x: 1
    scale_linear:
      x: 0.1
    scale_linear_turbo:
      x: 0.1
    axis_angular:
      yaw: 3
    scale_angular:
      yaw: 0.25
    scale_angular_turbo:
      yaw: 0.25
    enable_button: 4
    enable_turbo_button: -1
    require_enable_button: true
    publish_stamped_twist: true
    frame: base_link
